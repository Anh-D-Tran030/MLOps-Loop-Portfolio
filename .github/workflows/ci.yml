name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff black
      - run: ruff check . && black --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/forecast-api/requirements.txt
      - run: pytest services/forecast-api/tests/ -v

  eval-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Cache HuggingFace model downloads to avoid re-downloading DeBERTa (~1.4GB) on every run
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('services/llm-eval/requirements.txt') }}
      - run: pip install -e services/llm-eval/
      - run: mlops-eval score tests/fixtures/eval_set.jsonl --threshold 0.7

  build-push:
    needs: eval-gate
    # Only publish on an explicit release tag (e.g. `git tag v1.0.0 && git push --tags`),
    # not on every push to main — otherwise routine commits silently overwrite the
    # GHCR image with the placeholder model below (CI has no access to the gitignored
    # Kaggle dataset, so it cannot train the real model itself). A real-model image
    # must still be built and pushed manually from a machine that has data/train.csv.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: pip install dvc && pip install -r services/forecast-api/training/requirements.txt
      - name: Fetch dataset via DVC
        # dvc pull requires a configured remote (there isn't one, by design —
        # no writable DVC remote without a paid cloud account, see PHASE2-CLAUDE.md).
        # dvc update re-resolves an import-url dependency straight from its
        # recorded source URL instead, which needs no remote at all.
        run: dvc update data/train.csv.dvc
      - name: Restore MLflow state
        uses: actions/cache/restore@v4
        with:
          path: mlflow/
          key: mlflow-state-${{ github.run_id }}
          restore-keys: |
            mlflow-state-
      - name: Fetch Production model
        run: python scripts/fetch_production_model.py --out services/forecast-api/model.pkl
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/forecast-api
          push: true
          tags: ghcr.io/anh-d-tran030/mlops-loop:latest
